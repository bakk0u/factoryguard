[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "factoryguard"
version = "0.1.0"
description = "Industrial sensor monitoring: milestone 1"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "matplotlib>=3.7,<4", "scipy>=1.11,<2", "scikit-learn>=1.5,<2"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"factoryguard.monitoring" = ["dashboard.html"]
