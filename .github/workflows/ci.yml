name: Development release checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-campaign.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python scripts/build_reviewer_site.py --output reports/local/reviewer-site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify_reviewer_workflow.cjs
      - run: python -m unittest discover -s tests -v
      - run: python run_step1.py --output reports/local/ci-synthetic
      - run: python -m factoryguard.release demo --output reports/local/ci-demo
      - run: python -m factoryguard.release export --workspace reports/local/ci-demo --output reports/local/ci-demo/dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}
          path: reports/local/ci-demo/dashboard.html
      - name: Upload install-free reviewer site
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: factoryguard-reviewer-site
          path: reports/local/reviewer-site/
          if-no-files-found: error
