name: Optional evidence assistant checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  assistant:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Prototype scope: retain visible Windows failures without blocking Linux support.
    # Test steps/assertions/timeouts remain identical on both platforms.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      PYTHONUTF8: '1'
      FACTORYGUARD_PYTHON: python
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-assistant-lock.txt -r requirements-campaign.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: npm ci --prefix assistant
      - run: python -m factoryguard.assistant.workflows index
      - run: npm run build --prefix assistant
      - name: Actual N01 MCP test alone
        id: isolated_mcp
        working-directory: assistant
        run: node --import tsx --test --test-timeout=60000 test/isolated-mcp.ts
      - name: MCP platform preflight
        if: ${{ !cancelled() && steps.isolated_mcp.outcome != 'skipped' }}
        working-directory: assistant
        run: node --import tsx --test --test-timeout=60000 test/stdio.test.ts
      - name: Full assistant suite including the same N01
        if: ${{ !cancelled() && steps.isolated_mcp.outcome != 'skipped' }}
        run: npm test --prefix assistant
      - run: python -m unittest discover -s tests -v
      - run: python -m factoryguard.assistant.evaluate
