<svg xmlns="http://www.w3.org/2000/svg" width="440" height="580" viewBox="0 0 440 580" role="img" aria-labelledby="title"><title id="title">Locate the change, inspect its operating context, capture the investigation evidence.</title><defs><linearGradient id="spectrum"><stop stop-color="#438cff"/><stop offset=".6" stop-color="#ff69c8"/><stop offset="1" stop-color="#ffe46b"/></linearGradient><radialGradient id="glow"><stop stop-color="#163778" stop-opacity=".65"/><stop offset="1" stop-color="#070b18" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.spin{animation:spin 16s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.trace{stroke-dasharray:350;animation:draw 8s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes draw{0%{stroke-dashoffset:350}65%,100%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.spin,.pulse,.trace{animation:none;opacity:1;stroke-dashoffset:0}}</style><rect x="1" y="1" width="438" height="578" rx="22" fill="#070b18" stroke="#273650"/><text x="28" y="40" font-size="12" fill="#438cff" font-weight="700">THE INVESTIGATION WORKFLOW</text><rect x="28" y="65" width="384" height="144" rx="12" fill="#0d1527" stroke="#273650"/><text x="46" y="96" font-size="16" fill="#438cff" font-weight="700">01</text><text x="46" y="130" font-size="21" fill="#eef5ff" font-weight="700">Locate the change</text><text x="46" y="160" font-size="16" fill="#aabbd5" font-weight="400">Choose a bearing run</text><text x="46" y="183" font-size="16" fill="#aabbd5" font-weight="400">and an observation or period.</text><g class="pulse"><circle cx="387" cy="92" r="4" fill="#438cff" stroke="#438cff"/></g><rect x="28" y="228" width="384" height="144" rx="12" fill="#0d1527" stroke="#273650"/><text x="46" y="259" font-size="16" fill="#ff69c8" font-weight="700">02</text><text x="46" y="293" font-size="21" fill="#eef5ff" font-weight="700">Inspect the context</text><text x="46" y="323" font-size="16" fill="#aabbd5" font-weight="400">Compare forecasts, speed,</text><text x="46" y="346" font-size="16" fill="#aabbd5" font-weight="400">load, gaps and warnings.</text><g class="pulse"><circle cx="387" cy="255" r="4" fill="#ff69c8" stroke="#ff69c8"/></g><rect x="28" y="391" width="384" height="144" rx="12" fill="#0d1527" stroke="#273650"/><text x="46" y="422" font-size="16" fill="#ffe46b" font-weight="700">03</text><text x="46" y="456" font-size="21" fill="#eef5ff" font-weight="700">Capture the evidence</text><text x="46" y="486" font-size="16" fill="#aabbd5" font-weight="400">Keep investigation notes</text><text x="46" y="509" font-size="16" fill="#aabbd5" font-weight="400">and export a period report.</text><g class="pulse"><circle cx="387" cy="418" r="4" fill="#ffe46b" stroke="#ffe46b"/></g></svg>